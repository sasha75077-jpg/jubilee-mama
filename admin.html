<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ответы гостей - Админ панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #764ba2;
            margin-bottom: 30px;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .response-list {
            margin-top: 30px;
        }

        .response-item {
            background: #f8f9ff;
            border-left: 4px solid #764ba2;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .response-item.attending-yes {
            border-left-color: #28a745;
            background: #f0fff4;
        }

        .response-item.attending-no {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .response-item.attending-maybe {
            border-left-color: #ffc107;
            background: #fffef0;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .response-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .response-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .badge-yes {
            background: #28a745;
            color: white;
        }

        .badge-no {
            background: #dc3545;
            color: white;
        }

        .badge-maybe {
            background: #ffc107;
            color: #333;
        }

        .response-details {
            color: #666;
            margin: 5px 0;
        }

        .response-message {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            font-style: italic;
            color: #555;
        }

        .no-responses {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .refresh-btn {
            display: block;
            margin: 0 auto 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .export-btn {
            margin: 20px auto;
            display: block;
            padding: 10px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .export-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Ответы гостей на юбилей</h1>

        <button class="refresh-btn" onclick="loadResponses()">🔄 Обновить данные</button>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Всего ответов</div>
                <div class="stat-number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">✅ Придут</div>
                <div class="stat-number" id="yesCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🤔 Не уверены</div>
                <div class="stat-number" id="maybeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">😔 Не придут</div>
                <div class="stat-number" id="noCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">👥 Всего гостей</div>
                <div class="stat-number" id="guestCount">0</div>
            </div>
        </div>

        <button class="export-btn" onclick="exportToCSV()">📥 Скачать в Excel (CSV)</button>

        <div class="response-list" id="responseList">
            <div class="no-responses">
                <h3>Пока нет ответов от гостей</h3>
                <p>Ответы будут появляться здесь по мере их поступления</p>
            </div>
        </div>
    </div>

    <script>
        function loadResponses() {
            const responses = JSON.parse(localStorage.getItem('rsvpResponses') || '[]');

            // Update stats
            document.getElementById('totalCount').textContent = responses.length;

            const yesCount = responses.filter(r => r.attendance === 'yes').length;
            const maybeCount = responses.filter(r => r.attendance === 'maybe').length;
            const noCount = responses.filter(r => r.attendance === 'no').length;

            document.getElementById('yesCount').textContent = yesCount;
            document.getElementById('maybeCount').textContent = maybeCount;
            document.getElementById('noCount').textContent = noCount;

            // Calculate total guests (only for those who are coming)
            const totalGuests = responses
                .filter(r => r.attendance === 'yes')
                .reduce((sum, r) => sum + parseInt(r.guests || 1), 0);
            document.getElementById('guestCount').textContent = totalGuests;

            // Display responses
            const listContainer = document.getElementById('responseList');

            if (responses.length === 0) {
                listContainer.innerHTML = `
                    <div class="no-responses">
                        <h3>Пока нет ответов от гостей</h3>
                        <p>Ответы будут появляться здесь по мере их поступления</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = responses.map(response => {
                const attendanceClass = `attending-${response.attendance}`;
                const badgeClass = `badge-${response.attendance}`;
                const attendanceText = {
                    'yes': '✅ Придёт',
                    'maybe': '🤔 Не уверен(а)',
                    'no': '😔 Не придёт'
                }[response.attendance];

                return `
                    <div class="response-item ${attendanceClass}">
                        <div class="response-header">
                            <div class="response-name">${response.name}</div>
                            <div class="response-badge ${badgeClass}">${attendanceText}</div>
                        </div>
                        <div class="response-details">
                            📞 Телефон: ${response.phone || 'Не указан'}
                        </div>
                        <div class="response-details">
                            👥 Количество гостей: ${response.guests || 'Не указано'}
                        </div>
                        <div class="response-details">
                            🕐 Дата ответа: ${response.timestamp}
                        </div>
                        ${response.message ? `
                            <div class="response-message">
                                💝 Пожелание: "${response.message}"
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function exportToCSV() {
            const responses = JSON.parse(localStorage.getItem('rsvpResponses') || '[]');

            if (responses.length === 0) {
                alert('Нет данных для экспорта');
                return;
            }

            // Create CSV content
            const headers = ['Имя', 'Телефон', 'Гостей', 'Статус', 'Пожелание', 'Дата ответа'];
            const statusMap = {
                'yes': 'Придёт',
                'maybe': 'Не уверен',
                'no': 'Не придёт'
            };

            const csvRows = [headers.join(',')];

            responses.forEach(r => {
                const row = [
                    `"${r.name}"`,
                    `"${r.phone || ''}"`,
                    r.guests || '',
                    `"${statusMap[r.attendance]}"`,
                    `"${(r.message || '').replace(/"/g, '""')}"`,
                    `"${r.timestamp}"`
                ];
                csvRows.push(row.join(','));
            });

            // Download CSV
            const csvContent = '﻿' + csvRows.join('\n'); // UTF-8 BOM for Excel
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', 'ответы_гостей_юбилей.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Load responses on page load
        loadResponses();

        // Auto-refresh every 30 seconds
        setInterval(loadResponses, 30000);
    </script>
</body>
</html>
